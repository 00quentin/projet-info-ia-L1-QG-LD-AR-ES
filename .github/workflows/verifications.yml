name: Vérifications

on:
  push:
  pull_request:
  workflow_dispatch: # permet de lancer manuellement aussi

permissions:
  contents: read

# Un nouveau push sur la même branche annule la vérification devenue inutile.
concurrency:
  group: verifications-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Moteur Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Lancer les tests
        run: pytest

  web:
    name: Site web (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src
      - name: Construire le site
        run: npm run build
