name: Réveil de l'API

on:
  schedule:
    # Toutes les 10 minutes : l'offre gratuite de Render endort l'API après
    # 15 minutes sans visite (le réveil prend ensuite 30 à 60 secondes).
    - cron: '*/10 * * * *'
  workflow_dispatch: # permet de lancer manuellement aussi

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler /api/sante
        run: |
          curl --silent --show-error --location \
            --max-time 60 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "Statut : %{http_code}\n" \
            https://quant-terminal-api-baxq.onrender.com/api/sante
